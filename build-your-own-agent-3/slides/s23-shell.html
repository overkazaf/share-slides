          <text x="30" y="415" fill="#fff" font-size="10" font-weight="600">那 2.8 万行是让 mvn test 的 3000 行输出变成 30 行再进 context window</text>

          <text x="16" y="452" fill="#64748b" font-size="9">pi-shell 没有 benches、没有 criterion —— crate 内所有时间常数都是设计值，不是测量值</text>
