<section class="slide" data-ch="CH6 规则与记忆" data-title="代价页：作者自己也不敢默认打断，advisor 曾单 session 刷 309 次 advise">
  <div class="s-head">
    <div class="s-kicker"><span class="dot rose"></span>CH 6 · 规则与记忆</div>
    <h1 class="s-title">作者自己也<span class="hl-r">不敢</span>默认打断</h1>
    <div class="s-sub">三条代价，都是仓库里能查到的<b style="color:#e2e8f0">原话和数字</b>，不是推测。</div>
  </div>

  <div class="s-body">
    <div class="cols c64">
      <div class="figure">
        <svg viewBox="0 0 700 505" xmlns="http://www.w3.org/2000/svg">
          <!-- ① -->
          <rect x="16" y="10" width="668" height="136" rx="6" fill="rgba(136,19,55,.18)" stroke="#fb7185" stroke-width="1.2"/>
          <text x="32" y="33" fill="#fb7185" font-size="11.5" font-weight="700">① 仓库自带的 28 条 TTSR 规则，全是 interruptMode: never</text>
          <text x="32" y="54" fill="#94a3b8" font-size="9">全局默认明明是 interruptMode: "always"，规则级可覆盖。</text>
          <text x="32" y="74" fill="#cbd5e1" font-size="9">但 ts-no-any、ts-redundant-clear-guard 这些内置规则一条不落地选了 never ——</text>
          <text x="32" y="94" fill="#cbd5e1" font-size="9">不 abort，只把提醒渲染成 text block，前置到工具结果的第一个 block 之前。</text>
          <text x="32" y="115" fill="#64748b" font-size="8.5">return { content: [{ type: "text", text: reminder }, ...ctx.result.content] }</text>
          <text x="32" y="136" fill="#fb7185" font-size="8.5">读法：打断的能力做出来了，默认档位却挑了最保守的那一档。</text>

          <!-- ② -->
          <rect x="16" y="156" width="668" height="182" rx="6" fill="rgba(136,19,55,.18)" stroke="#fb7185" stroke-width="1.2"/>
          <text x="32" y="179" fill="#fb7185" font-size="11.5" font-weight="700">② advisor 在一个 session 里刷了 309 次 advise（issue #3520）</text>

          <rect x="32" y="192" width="140" height="52" rx="5" fill="rgba(2,6,23,.6)" stroke="#334155" stroke-width="1"/>
          <text x="102" y="217" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">309</text>
          <text x="102" y="234" fill="#64748b" font-size="8" text-anchor="middle">次 advise 调用</text>

          <rect x="186" y="192" width="140" height="52" rx="5" fill="rgba(2,6,23,.6)" stroke="#334155" stroke-width="1"/>
          <text x="256" y="217" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">92</text>
          <text x="256" y="234" fill="#64748b" font-size="8" text-anchor="middle">条唯一内容</text>

          <rect x="340" y="192" width="140" height="52" rx="5" fill="rgba(2,6,23,.6)" stroke="#fb7185" stroke-width="1.2"/>
          <text x="410" y="217" fill="#fb7185" font-size="18" font-weight="700" text-anchor="middle">114</text>
          <text x="410" y="234" fill="#64748b" font-size="8" text-anchor="middle">次 "Stop."</text>

          <rect x="494" y="192" width="176" height="52" rx="5" fill="rgba(2,6,23,.6)" stroke="#334155" stroke-width="1"/>
          <text x="582" y="217" fill="#cbd5e1" font-size="16" font-weight="700" text-anchor="middle">52 / 41</text>
          <text x="582" y="234" fill="#64748b" font-size="8" text-anchor="middle">次「无问题，继续」/「完成」</text>

          <text x="32" y="266" fill="#cbd5e1" font-size="9">任务早就做完了，主转录还在被 &lt;advisory severity="blocker"&gt;Stop.&lt;/advisory&gt; 灌满。</text>
          <text x="32" y="288" fill="#cbd5e1" font-size="9">修复注释的原话：“make the rules load-bearing in code instead of prose.”</text>
          <text x="32" y="310" fill="#fb7185" font-size="9">而且抑制必须对模型不可见 —— 被丢弃的 advise 照样回 "Recorded."。</text>
          <text x="32" y="330" fill="#64748b" font-size="8.5">理由写在注释里：告诉它「你被拦了」，它会把 "Stop." 换成 "Halt."、"Stop now." 绕过去。</text>

          <!-- ③ -->
          <rect x="16" y="348" width="668" height="142" rx="6" fill="rgba(136,19,55,.18)" stroke="#fb7185" stroke-width="1.2"/>
          <text x="32" y="371" fill="#fb7185" font-size="11.5" font-weight="700">③ advisor 默认走 slow 强模型链，而且不继承主模型</text>
          <text x="32" y="392" fill="#94a3b8" font-size="9">ROLE_PRIORITY_ALIAS = { advisor: "slow", tiny: "smol" } —— 省钱不靠降档。</text>
          <text x="32" y="412" fill="#cbd5e1" font-size="9">靠的是另外五道：默认关闭 · 只喂增量转录 · 四层输出闸门 ·</text>
          <text x="32" y="431" fill="#cbd5e1" font-size="9">immuneTurns 打断冷却 3 轮 · syncBacklog 背压最多阻塞主 agent 30 秒。</text>
          <text x="32" y="452" fill="#64748b" font-size="8.5">四层闸门：归一化 → 无内容短语黑名单 → 全 session 精确去重(4096 FIFO) → 每周期最多一条</text>
          <text x="32" y="473" fill="#fb7185" font-size="8.5">注释原话：“silence is the correct expression of 'no concerns'”</text>
        </svg>
      </div>

      <div class="figure">
        <svg viewBox="0 0 440 495" xmlns="http://www.w3.org/2000/svg">
          <text x="16" y="16" fill="#34d399" font-size="10.5" font-weight="600">但它换到了 prompt-only 给不了的东西</text>

          <rect x="16" y="26" width="408" height="92" rx="6" fill="rgba(6,78,59,.14)" stroke="#34d399" stroke-width="1"/>
          <text x="30" y="47" fill="#34d399" font-size="9.5" font-weight="600">可测试 · 可生成 · 可回放校验</text>
          <text x="30" y="66" fill="#cbd5e1" font-size="8.5">omp ttsr test / scan：喂一段代码进真实匹配管线</text>
          <text x="30" y="85" fill="#cbd5e1" font-size="8.5">/omfg：从用户的抱怨生成规则，再回放历史校验</text>
          <text x="30" y="105" fill="#64748b" font-size="8">system prompt 里的一句 "never use any" 没有这三样</text>

          <text x="16" y="142" fill="#a78bfa" font-size="10" font-weight="600">顺带说清 mnemopi 的天花板（默认关闭）</text>

          <rect x="16" y="152" width="408" height="46" rx="6" fill="rgba(30,41,59,.5)" stroke="#334155" stroke-width="1"/>
          <text x="30" y="170" fill="#a78bfa" font-size="9.5" font-weight="600">向量以 JSON 文本存，无 vec0 索引</text>
          <text x="30" y="187" fill="#94a3b8" font-size="8.5">memory_embeddings.embedding_json，sqlite-vec 从不建表</text>

          <rect x="16" y="204" width="408" height="46" rx="6" fill="rgba(30,41,59,.5)" stroke="#334155" stroke-width="1"/>
          <text x="30" y="222" fill="#a78bfa" font-size="9.5" font-weight="600">暴力扫描，10000 行封顶</text>
          <text x="30" y="239" fill="#94a3b8" font-size="8.5">O(N) 全表拉出来交给 native top-k，规模上会先撞墙</text>

          <rect x="16" y="256" width="408" height="46" rx="6" fill="rgba(30,41,59,.5)" stroke="#334155" stroke-width="1"/>
          <text x="30" y="274" fill="#a78bfa" font-size="9.5" font-weight="600">事实去重是 SPO 精确匹配</text>
          <text x="30" y="291" fill="#94a3b8" font-size="8.5">换个说法的同一件事会被记两遍</text>

          <rect x="16" y="308" width="408" height="46" rx="6" fill="rgba(30,41,59,.5)" stroke="#334155" stroke-width="1"/>
          <text x="30" y="326" fill="#a78bfa" font-size="9.5" font-weight="600">工作记忆 24h TTL，12h 巩固窗口</text>
          <text x="30" y="343" fill="#94a3b8" font-size="8.5">没赶上巩固的，24 小时后是真 DELETE</text>

          <rect x="16" y="366" width="408" height="112" rx="6" fill="rgba(76,29,149,.14)" stroke="#a78bfa" stroke-width="1"/>
          <text x="30" y="387" fill="#fff" font-size="10" font-weight="600">这一章能搬走的</text>
          <text x="30" y="407" fill="#cbd5e1" font-size="8.5">不是那 28 条规则，也不是那套记忆表结构；</text>
          <text x="30" y="425" fill="#cbd5e1" font-size="8.5">是「按错误的时间尺度，给它配一个执行边界」——</text>
          <text x="30" y="443" fill="#cbd5e1" font-size="8.5">秒级用流式匹配，轮级用第二意见，跨 session 用记忆。</text>
          <text x="30" y="464" fill="#a78bfa" font-size="8.5">以及：把 prose 里的软约束，落成代码里的硬闸门。</text>
        </svg>
      </div>
    </div>
  </div>
