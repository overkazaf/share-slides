<section class="slide" data-ch="CH5 Rust" data-title="最诚实的一张 benchmark：小批量上 Rust 更慢，0.86×">
  <div class="s-head">
    <div class="s-kicker"><span class="dot orange"></span>CH 5 · Rust 热路径</div>
    <h1 class="s-title">最诚实的一张 benchmark：小批量上 Rust <span class="hl-r">更慢</span></h1>
    <div class="s-sub">全仓唯一提交在册的 benchmark 结果。N-API 跨越成本是个常数 —— <b style="color:#e2e8f0">payload 越小，它占的比例越大</b>。</div>
  </div>

  <div class="s-body">
    <div class="cols c64">
      <div class="figure">

          <text x="684" y="18" fill="#64748b" font-size="8.5" text-anchor="end">Apple M1 · bun 1.3.14 · crossing-inclusive</text>

          <rect x="12" y="120" width="676" height="26" rx="4" fill="rgba(136,19,55,.3)" stroke="#fb7185" stroke-width="1"/>

          <rect x="16" y="272" width="668" height="76" rx="6" fill="rgba(30,41,59,.5)" stroke="#334155" stroke-width="1"/>
          <text x="30" y="292" fill="#94a3b8" font-size="9.5" font-weight="600">读法</text>
          <text x="100" y="292" fill="#cbd5e1" font-size="9.5">同一个 kernel，count=10 是 <tspan fill="#fb7185">0.86×（净亏）</tspan>，count=1000 是 2.48×</text>
          <text x="30" y="313" fill="#cbd5e1" font-size="9.5">跨越成本吃光了小 payload 的全部收益；变的不是代码，只是批量大小</text>
          <text x="30" y="334" fill="#cbd5e1" font-size="9.5">只有复杂度高的核（MMR 重排）才有 22–36× 这种量级差</text>

          <text x="30" y="382" fill="#fff" font-size="12" font-family="ui-monospace,Menlo,monospace">If native is slower, do not switch callsites.</text>
          <text x="30" y="402" fill="#64748b" font-size="8.5">docs/porting-to-natives.md:173 —— 仓库自己写下的规矩</text>

          <text x="16" y="440" fill="#fb7185" font-size="9" font-weight="600">口径必须说清</text>
          <text x="100" y="440" fill="#94a3b8" font-size="9">这是 mnemopi 向量核的数字，不是 grep / shell / walker 的。</text>
