<section class="slide" data-ch="CH7 收口" data-title="能抄的五条 / 别抄的六条">
  <div class="s-head">
    <div class="s-kicker"><span class="dot emerald"></span>CH 7 · 工程文化与收口</div>
    <h1 class="s-title">能抄的<span class="hl-e">五条</span>　／　别抄的<span class="hl-r">六条</span></h1>
    <div class="s-sub">左边五条：<b style="color:#e2e8f0">明天就能动手，附成本</b>。右边六条：<b style="color:#e2e8f0">先看它在解什么问题</b> —— 你没有那个问题，就别付那个代价。</div>
  </div>

  <div class="s-body">
    <div class="cols c64">
      <div class="figure">
        <svg viewBox="0 0 700 505" xmlns="http://www.w3.org/2000/svg">
          <text x="16" y="18" fill="#34d399" font-size="10" font-weight="600">✅ 能抄的五条 —— 每条都是「明天就能开始做」</text>

          <rect x="16" y="28" width="668" height="90" rx="6" fill="rgba(6,78,59,.18)" stroke="#34d399" stroke-width="1"/>
          <text x="30" y="47" fill="#34d399" font-size="10.5" font-weight="600">① AGENTS.md 写成规矩，不写成品味</text>
          <text x="30" y="66" fill="#cbd5e1" font-size="8.5"><tspan fill="#fff">怎么做</tspan>：只写「不许用什么，改用什么」。每条禁令必须配一个替代物，否则等于没说。</text>
          <text x="30" y="81" fill="#cbd5e1" font-size="8.5"><tspan fill="#fff">关键一步</tspan>：每条不显然的规矩后面挂上当初出事的 issue 号 —— 让人知道这不是洁癖。</text>
          <text x="30" y="96" fill="#cbd5e1" font-size="8.5"><tspan fill="#fff">为什么有效</tspan>：agent 领会不了你的品味，但一条明确的禁令它会照做。能自动查的就接进 CI。</text>
          <text x="30" y="112" fill="#64748b" font-size="8">AGENTS.md:5,7,35-41,51,68-81　·　成本：一天写初版，以后每出一次事故补一行　·　性价比最高的一条</text>

          <rect x="16" y="122" width="668" height="90" rx="6" fill="rgba(6,78,59,.18)" stroke="#34d399" stroke-width="1"/>
          <text x="30" y="141" fill="#34d399" font-size="10.5" font-weight="600">② 做一个「它改代码改得准不准」的小题库，20 道就够</text>
          <text x="30" y="160" fill="#cbd5e1" font-size="8.5"><tspan fill="#fff">怎么做</tspan>：从你自己的代码库拿真文件，程序化地改动一处，再看 agent 能不能改回同一处。</text>
          <text x="30" y="175" fill="#cbd5e1" font-size="8.5"><tspan fill="#fff">判分</tspan>：逐字节比对，但把「改错了」和「只是缩进不同」分成两类 —— 否则数字没法看。</text>
          <text x="30" y="190" fill="#cbd5e1" font-size="8.5"><tspan fill="#fff">为什么有效</tspan>：它测的是<tspan fill="#fff">落刀准不准</tspan>，不是聪不聪明。换模型时，你要看的就是这个数。</text>
          <text x="30" y="206" fill="#64748b" font-size="8">generate.ts:1-24　·　verify.ts:1-23　·　成本：一个周末；只测一种语言一种改动，200 行就够</text>

          <rect x="16" y="216" width="668" height="90" rx="6" fill="rgba(6,78,59,.18)" stroke="#34d399" stroke-width="1"/>
          <text x="30" y="235" fill="#34d399" font-size="10.5" font-weight="600">③ 不追覆盖率，改追「这条测试守的是哪个承诺」</text>
          <text x="30" y="254" fill="#cbd5e1" font-size="8.5"><tspan fill="#fff">规矩一句话</tspan>：写不出这条测试守护的那个对外承诺，就不要写这条测试。</text>
          <text x="30" y="269" fill="#cbd5e1" font-size="8.5"><tspan fill="#fff">配一条硬禁令</tspan>：不许拿字符串去扫源码当断言 —— 那种测试只会在重构时挡路。</text>
          <text x="30" y="284" fill="#cbd5e1" font-size="8.5"><tspan fill="#fff">为什么有效</tspan>：覆盖率鼓励多写；承诺清单鼓励少写但写对。<tspan fill="#fff">这条跟 agent 无关，纯软件工程收益。</tspan></text>
          <text x="30" y="300" fill="#64748b" font-size="8">AGENTS.md:239-250　·　成本：只是一条 review 规矩，任何项目今天就能加</text>

          <rect x="16" y="310" width="668" height="90" rx="6" fill="rgba(6,78,59,.18)" stroke="#34d399" stroke-width="1"/>
          <text x="30" y="329" fill="#34d399" font-size="10.5" font-weight="600">④ CI 里的逻辑搬出 YAML，做成本地能跑、自己也有测试的脚本</text>
          <text x="30" y="348" fill="#cbd5e1" font-size="8.5"><tspan fill="#fff">怎么做</tspan>：分片、重试这类逻辑写成脚本，支持 --dry-run，脚本本身也有单测。</text>
          <text x="30" y="363" fill="#cbd5e1" font-size="8.5"><tspan fill="#fff">再加一条</tspan>：所有魔数旁边写清它是怎么量出来的。例：为什么一批切 5 个文件？</text>
          <text x="30" y="378" fill="#cbd5e1" font-size="8.5">注释里记着「256MB 堆下，一批 10 个约一半会崩；一批 5 个，跑 20 次 0 次崩」。</text>
          <text x="30" y="394" fill="#64748b" font-size="8">scripts/ci-test-ts.ts:31-127　·　ci.yml:206-220　·　成本：把已有 YAML 逻辑搬一次家</text>

          <rect x="16" y="404" width="668" height="90" rx="6" fill="rgba(6,78,59,.18)" stroke="#34d399" stroke-width="1"/>
          <text x="30" y="423" fill="#34d399" font-size="10.5" font-weight="600">⑤ 文档只留一份，人和 agent 读同一份</text>
          <text x="30" y="442" fill="#cbd5e1" font-size="8.5"><tspan fill="#fff">怎么做</tspan>：docs/ 是唯一权威；AGENTS.md 里<tspan fill="#fff">不复述架构，只放一张索引表</tspan>。</text>
          <text x="30" y="457" fill="#cbd5e1" font-size="8.5">每篇文档顶部列出它对应的实现文件路径，让 agent 的检索路径和人的阅读路径重合。</text>
          <text x="30" y="472" fill="#cbd5e1" font-size="8.5"><tspan fill="#fff">为什么有效</tspan>：文档一过期，agent 立刻开始犯错 —— <tspan fill="#fff">等于给文档装了个自动报警器</tspan>。</text>
          <text x="30" y="488" fill="#64748b" font-size="8">DEVELOPMENT.md:3-10,61-81　·　docs-index.ts:1-13　·　成本：一次目录整理 + 一条 review 规矩</text>
        </svg>
      </div>

      <div class="figure">
        <svg viewBox="0 0 440 495" xmlns="http://www.w3.org/2000/svg">
          <text x="16" y="18" fill="#fb7185" font-size="10" font-weight="600">❌ 别抄的六条 —— 先看它在解什么问题</text>

          <rect x="16" y="28" width="408" height="72" rx="6" fill="rgba(136,19,55,.18)" stroke="#fb7185" stroke-width="1"/>
          <text x="30" y="46" fill="#fb7185" font-size="9.5" font-weight="600">① 自建一整套 CI 集群</text>
          <text x="30" y="63" fill="#cbd5e1" font-size="8"><tspan fill="#fff">它在解</tspan>：把 Rust 编到 8 个平台，还不让 PR 代码碰共享缓存</text>
          <text x="30" y="77" fill="#cbd5e1" font-size="8"><tspan fill="#fff">你多半没这问题</tspan>：没有 native 代码，托管 runner 完全够</text>
          <text x="30" y="93" fill="#64748b" font-size="8">代价：32 vCPU / 125 GiB 裸金属自己养　·　infra/docs/README.md:70-84</text>

          <rect x="16" y="104" width="408" height="72" rx="6" fill="rgba(136,19,55,.18)" stroke="#fb7185" stroke-width="1"/>
          <text x="30" y="122" fill="#fb7185" font-size="9.5" font-weight="600">② Bazel + zig 那套交叉编译</text>
          <text x="30" y="139" fill="#cbd5e1" font-size="8"><tspan fill="#fff">它在解</tspan>：多平台产物 + 远程缓存复用</text>
          <text x="30" y="153" fill="#cbd5e1" font-size="8"><tspan fill="#fff">代价</tspan>：每平台分发 <tspan fill="#fff">138–285 MiB</tspan>，而核心包只有 111 KiB</text>
          <text x="30" y="169" fill="#64748b" font-size="8">只编一个平台？<tspan fill="#94a3b8">cargo 就够，别开这个头</tspan></text>

          <rect x="16" y="180" width="408" height="72" rx="6" fill="rgba(136,19,55,.18)" stroke="#fb7185" stroke-width="1"/>
          <text x="30" y="198" fill="#fb7185" font-size="9.5" font-weight="600">③ 122 篇文档这个<tspan fill="#fff">量</tspan></text>
          <text x="30" y="215" fill="#cbd5e1" font-size="8"><tspan fill="#fff">为什么这么多</tspan>：文档是喂给 agent 检索的语料，不只给人看</text>
          <text x="30" y="229" fill="#cbd5e1" font-size="8"><tspan fill="#fff">照抄的下场</tspan>：一片没人维护的<tspan fill="#fff">文档坟场</tspan></text>
          <text x="30" y="245" fill="#64748b" font-size="8">抄左边第 ⑤ 条那个<tspan fill="#94a3b8">结构</tspan>，不要抄篇数</text>

          <rect x="16" y="256" width="408" height="72" rx="6" fill="rgba(136,19,55,.18)" stroke="#fb7185" stroke-width="1"/>
          <text x="30" y="274" fill="#fb7185" font-size="9.5" font-weight="600">④ 53 万行测试这个<tspan fill="#fff">量</tspan></text>
          <text x="30" y="291" fill="#cbd5e1" font-size="8"><tspan fill="#fff">它是怎么来的</tspan>：17 个大版本累积 + 多 provider 组合爆炸</text>
          <text x="30" y="305" fill="#cbd5e1" font-size="8"><tspan fill="#fff">也就是说</tspan>：这是结果，不是目标 —— 没人立过这个 KPI</text>
          <text x="30" y="321" fill="#64748b" font-size="8">抄左边第 ③ 条那套<tspan fill="#94a3b8">判据</tspan>，不要抄数量</text>

          <rect x="16" y="332" width="408" height="72" rx="6" fill="rgba(136,19,55,.18)" stroke="#fb7185" stroke-width="1"/>
          <text x="30" y="350" fill="#fb7185" font-size="9.5" font-weight="600">⑤ 它那个「向量检索」的实现</text>
          <text x="30" y="367" fill="#cbd5e1" font-size="8"><tspan fill="#fff">实情</tspan>：压根没建索引 —— 每次查询<tspan fill="#fff">全表扫</tspan>，还封死一万行</text>
          <text x="30" y="381" fill="#cbd5e1" font-size="8">向量存成 JSON 文本。<tspan fill="#fff">数据一多，先撞墙的是它</tspan></text>
          <text x="30" y="397" fill="#64748b" font-size="8">helpers.ts:405-419　·　vector-index.ts:43-76　·　schema.ts:274-281</text>

          <rect x="16" y="408" width="408" height="72" rx="6" fill="rgba(136,19,55,.28)" stroke="#fb7185" stroke-width="1.4"/>
          <text x="30" y="426" fill="#fb7185" font-size="9.5" font-weight="600">⑥ stats 面板的监听方式　<tspan fill="#94a3b8" font-size="8">读码推断，未实跑</tspan></text>
          <text x="30" y="443" fill="#cbd5e1" font-size="8">注释自称 "a localhost tool"，但代码<tspan fill="#fff">没传 hostname</tspan></text>
          <text x="30" y="457" fill="#cbd5e1" font-size="8">按默认行为应绑 0.0.0.0，CORS 还是 "*" —— <tspan fill="#fff">同 LAN 就能读</tspan></text>
          <text x="30" y="473" fill="#64748b" font-size="8">读到的是 token 用量 / 成本 / 项目路径　·　stats/src/server.ts:304</text>
        </svg>
      </div>
    </div>

    <div class="takeaway">
      omp 的价值不在<b>它做了什么</b>，而在它把<b>每个决定的代价</b>都摊开给你看了 —— 抄功能会死，抄它「<b>怎么判断该不该做</b>」才活。
    </div>
