<section class="slide" data-ch="CH1 体量" data-title="血缘只剩 LICENSE 的两行版权：omp 与 pi 是两个独立仓库">
  <div class="s-head">

    <h1 class="s-title">血缘只剩两行版权：omp 与 pi 是<span class="hl-r">两个独立仓库</span></h1>
    <div class="s-sub">它是 pi 的<b style="color:#e2e8f0">代码级深度 fork</b>，但不是 GitHub 意义上那种带 upstream 指针的 fork。</div>
  </div>
