<section class="slide" data-ch="CH1 定义" data-title="什么是 Agent：能自己决定下一步、能动手改变环境的循环">
  <div class="s-head">
    <div class="s-kicker"><span class="dot emerald"></span>CH 1 · 定义</div>
    <h1 class="s-title">Agent = 能<span class="hl-e">自己决定下一步</span>、能<span class="hl">动手改变环境</span>的循环</h1>
    <div class="s-sub">判据只有一条：<b style="color:#e2e8f0">下一步做什么，是代码写死的，还是模型现场决定的。</b></div>
  </div>

        </defs>

        <text x="315" y="161" fill="#fbbf24" font-size="9" text-anchor="middle">"下一步做什么？"</text>

        <text x="775" y="161" fill="#64748b" font-size="8" text-anchor="middle">副作用发生在这里</text>

        <text x="672" y="63" fill="#22d3ee" font-size="9" text-anchor="middle">这轮不再要工具 ⇒ 循环收敛，退出</text>
        <text x="792" y="212" fill="#fb7185" font-size="9">← 护栏装在这一段：权限 · 沙箱 · 审批</text>

        <rect x="975" y="245" width="160" height="167" rx="8" fill="rgba(15,23,42,.6)" stroke="#1e293b" stroke-width="1"/>

        <circle cx="996" cy="325" r="4" fill="#fbbf24"/>
        <text x="1008" y="328" fill="#cbd5e1" font-size="9.5">能循环 · 自己判停</text>
        <text x="1008" y="341" fill="#475569" font-size="8">没有 → 只是提示链</text>
        <circle cx="996" cy="362" r="4" fill="#a78bfa"/>
        <text x="1008" y="365" fill="#cbd5e1" font-size="9.5">能看见 · 反馈回灌</text>
        <text x="1008" y="378" fill="#475569" font-size="8">没有 → 只是开环生成</text>
        <text x="991" y="400" fill="#fb7185" font-size="8.5">三者缺一，就不算 agent</text>
      
          </g>
        
          </g>
        </svg>
    </div>

    <div class="takeaway">
      <b>所以 →</b> 造 agent 不是训模型，是把这个循环的<b>每一段</b>做扎实：喂什么上下文、给什么工具、何时停、出错怎么办、越权怎么拦 —— 这一整套叫 <b>harness</b>。
    </div>
