<section class="slide" data-ch="CH3 原理" data-title="搭这个工位，你只有五个决定要做">
  <div class="s-head">
    <div class="s-kicker"><span class="dot amber"></span>CH 3 · 原理 · 落到手上</div>
    <h1 class="s-title">搭这个工位，真正要你拍板的只有<span class="hl-a">五件事</span></h1>
    <div class="s-sub">名词一堆，真要你拿主意的就这五件。<b style="color:#e2e8f0">每一件都有一个能查的数字兜底</b> —— 这五件拍错了，换多强的模型都救不回来。</div>
  </div>

  <div class="s-body">
    <div class="figure plain">
      <svg viewBox="0 0 1160 452" xmlns="http://www.w3.org/2000/svg">
        <!-- ① 桌上摆什么 -->
        <rect x="16" y="10" width="1128" height="80" rx="8" fill="#0f172a"/>
        <rect x="16" y="10" width="1128" height="80" rx="8" fill="rgba(76,29,149,.3)" stroke="#a78bfa" stroke-width="1.4"/>
        <text x="40" y="38" fill="#a78bfa" font-size="21" font-weight="700">01</text>
        <text x="86" y="38" fill="#fff" font-size="15" font-weight="700">桌上摆什么 —— 资料摊太多，它反而找不着</text>
        <text x="86" y="60" fill="#cbd5e1" font-size="10.5">塞得进去 ≠ 它找得到。<tspan fill="#fff">多塞一份不相干的资料，成绩反而比什么都不给还差</tspan>；窗口从 128k 拉到 1M，长文里找答案的准确率从 91.8% 掉到 54.0%。</text>
        <text x="86" y="80" fill="#94a3b8" font-size="10">怎么办：只摆这一步用得上的。摆不下就把早先的聊天压成一段摘要、最近的原样留着 —— <tspan fill="#a78bfa">但别把"它调了工具"和"工具回了什么"拆散</tspan>。</text>

        <!-- ② 什么时候算干完 -->
        <rect x="16" y="98" width="1128" height="80" rx="8" fill="#0f172a"/>
        <rect x="16" y="98" width="1128" height="80" rx="8" fill="rgba(6,78,59,.34)" stroke="#34d399" stroke-width="1.4"/>
        <text x="40" y="126" fill="#34d399" font-size="21" font-weight="700">02</text>
        <text x="86" y="126" fill="#fff" font-size="15" font-weight="700">什么时候算干完 —— 得你定，别指望它自觉</text>
        <text x="86" y="148" fill="#cbd5e1" font-size="10.5">四种收场：<tspan fill="#fff">它不再要工具了</tspan>（最常见）· 转够次数 · 工具说"到此为止" · 你按停或出错。<tspan fill="#fbbf24">OpenAI 默认最多转 10 圈，Claude 默认不限</tspan> —— 同一件事，两家的默认胆量是反的。</text>
        <text x="86" y="168" fill="#94a3b8" font-size="10">还有两条：话说一半被截断，这批工具调用<tspan fill="#fff">全算失败、让它重说一遍</tspan>；报错别只回"失败"，告诉它哪个字段填错了，它自己就能改对。</text>

        <!-- ③ 走错了怎么退 -->
        <rect x="16" y="186" width="1128" height="80" rx="8" fill="#0f172a"/>
        <rect x="16" y="186" width="1128" height="80" rx="8" fill="rgba(8,51,68,.34)" stroke="#22d3ee" stroke-width="1.4"/>
        <text x="40" y="214" fill="#22d3ee" font-size="21" font-weight="700">03</text>
        <text x="86" y="214" fill="#fff" font-size="15" font-weight="700">走错了怎么退 —— 聊天记录要能长岔路</text>
        <text x="86" y="236" fill="#cbd5e1" font-size="10.5">每条记录都记着"上一条是谁"，<tspan fill="#fff">只往后加，从不改旧的</tspan>。于是"回到三步之前换个思路"是翻回去接着写，不是从头再来一遍。</text>
        <text x="86" y="256" fill="#94a3b8" font-size="10">但能退回来的只有<tspan fill="#fff">"说过的话"</tspan>：文件已经改了、请求已经发出去了，<tspan fill="#fb7185">这些退不回来</tspan> —— 所以还得配 git 快照和沙箱。</text>

        <!-- ④ 谁来判对错 -->
        <rect x="16" y="274" width="1128" height="80" rx="8" fill="#0f172a"/>
        <rect x="16" y="274" width="1128" height="80" rx="8" fill="rgba(124,45,18,.32)" stroke="#fb923c" stroke-width="1.4"/>
        <text x="40" y="302" fill="#fb923c" font-size="21" font-weight="700">04</text>
        <text x="86" y="302" fill="#fff" font-size="15" font-weight="700">谁来验收 —— 让它自己判，它只会说干得挺好</text>
        <text x="86" y="324" fill="#cbd5e1" font-size="10.5">干活的和验收的<tspan fill="#fff">得是两个</tspan>：验收那个<tspan fill="#fff">没参与写，所以不心疼、下得去手</tspan>。这是全场唯一一条<tspan fill="#fb923c">换个更聪明的模型也解决不了</tspan>的事。</text>
        <text x="86" y="344" fill="#94a3b8" font-size="10">多开一个 agent 值不值？好处是<tspan fill="#fff">各看各的资料、不互相带偏</tspan>，不是"人多干得快" —— 代价是一个 agent 约 4 倍 token，多 agent 约 15 倍。<tspan fill="#fff">动手的只留一个，其余只出主意</tspan>。</text>

        <!-- ⑤ 它能碰什么 -->
        <rect x="16" y="362" width="1128" height="80" rx="8" fill="#0f172a"/>
        <rect x="16" y="362" width="1128" height="80" rx="8" fill="rgba(136,19,55,.34)" stroke="#fb7185" stroke-width="1.4"/>
        <text x="40" y="390" fill="#fb7185" font-size="21" font-weight="700">05</text>
        <text x="86" y="390" fill="#fff" font-size="15" font-weight="700">它能碰什么 —— 卡在真要动手那一刻，不是写在提示词里</text>
        <text x="86" y="412" fill="#cbd5e1" font-size="10.5">默认只让读。要改文件、要联网、要碰敏感目录，<tspan fill="#fff">各配一个开关</tspan>。判断标准不是"有没有副作用"，是<tspan fill="#fff">"这一步能不能撤回"</tspan> —— 撤不回的，先问人。</text>
        <text x="86" y="432" fill="#94a3b8" font-size="10">在提示词里写"请不要乱来"没用：<tspan fill="#fb7185">别人在数据里塞一句"忽略前面的指令"，它分不清哪句是命令、哪句是数据</tspan>。</text>
      </svg>
    </div>
  </div>
