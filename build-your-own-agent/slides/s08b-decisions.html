<section class="slide" data-ch="CH3 原理" data-title="搭这个工位，真正要你拍板的只有五件事">
  <div class="s-head">
    <div class="s-kicker"><span class="dot amber"></span>CH 3 · 原理 · 落到手上</div>
    <h1 class="s-title">搭这个工位，真正要你拍板的只有<span class="hl-a">五件事</span></h1>
    <div class="s-sub">名词一堆，真要你拿主意的就这五件。<b style="color:#e2e8f0">这五件拍错了，换多强的模型都救不回来</b>。</div>
  </div>

  <div class="s-body">
    <div class="figure plain">
      <svg viewBox="0 0 1160 452" xmlns="http://www.w3.org/2000/svg">
        <rect x="16" y="0" width="1128" height="84" rx="8" fill="#0f172a"/>
        <rect x="16" y="0" width="1128" height="84" rx="8" fill="rgba(76,29,149,.3)" stroke="#a78bfa" stroke-width="1.4"/>
        <text x="40" y="30" fill="#a78bfa" font-size="21" font-weight="700">01</text>
        <text x="86" y="30" fill="#fff" font-size="15" font-weight="700">桌上摆什么 —— 资料摊太多，它反而找不着</text>
        <text x="86" y="54" fill="#cbd5e1" font-size="10.5">多塞一份不相干的资料，它的成绩<tspan fill="#fff">反而比什么都不给还差</tspan> —— 不是它笨，是注意力被摊薄了。</text>
        <text x="86" y="74" fill="#94a3b8" font-size="10">窗口从 128k 拉到 1M，长文里找答案的准确率从 91.8% 掉到 54.0%。<tspan fill="#a78bfa">只摆这一步用得上的，摆不下就把早先的聊天压成摘要。</tspan></text>

        <rect x="16" y="88" width="1128" height="84" rx="8" fill="#0f172a"/>
        <rect x="16" y="88" width="1128" height="84" rx="8" fill="rgba(6,78,59,.34)" stroke="#34d399" stroke-width="1.4"/>
        <text x="40" y="118" fill="#34d399" font-size="21" font-weight="700">02</text>
        <text x="86" y="118" fill="#fff" font-size="15" font-weight="700">什么时候算干完 —— 得你定，别指望它自觉</text>
        <text x="86" y="142" fill="#cbd5e1" font-size="10.5">最常见的收场是"<tspan fill="#fff">它不再要工具了</tspan>"；另外三种：转够次数、工具说到此为止、你按停或出错。</text>
        <text x="86" y="162" fill="#94a3b8" font-size="10"><tspan fill="#fbbf24">OpenAI 默认最多转 10 圈，Claude 默认不限</tspan> —— 同一件事两家胆量相反。你不设上限，它跑飞的时候就没人踩刹车。</text>

        <rect x="16" y="176" width="1128" height="84" rx="8" fill="#0f172a"/>
        <rect x="16" y="176" width="1128" height="84" rx="8" fill="rgba(8,51,68,.34)" stroke="#22d3ee" stroke-width="1.4"/>
        <text x="40" y="206" fill="#22d3ee" font-size="21" font-weight="700">03</text>
        <text x="86" y="206" fill="#fff" font-size="15" font-weight="700">走错了怎么退 —— 聊天记录要能长岔路</text>
        <text x="86" y="230" fill="#cbd5e1" font-size="10.5">记录<tspan fill="#fff">只往后加、从不改旧的</tspan>，所以"回到三步之前换个思路"是翻回去接着写，不用从头再来。</text>
        <text x="86" y="250" fill="#94a3b8" font-size="10">但能退回来的只有<tspan fill="#fff">说过的话</tspan>：文件已经改了、请求已经发出去了，<tspan fill="#fb7185">这些退不回来</tspan> —— 所以还得配 git 快照和沙箱。</text>

        <rect x="16" y="264" width="1128" height="84" rx="8" fill="#0f172a"/>
        <rect x="16" y="264" width="1128" height="84" rx="8" fill="rgba(124,45,18,.32)" stroke="#fb923c" stroke-width="1.4"/>
        <text x="40" y="294" fill="#fb923c" font-size="21" font-weight="700">04</text>
        <text x="86" y="294" fill="#fff" font-size="15" font-weight="700">谁来验收 —— 让它自己判，它只会说干得挺好</text>
        <text x="86" y="318" fill="#cbd5e1" font-size="10.5">干活的和验收的<tspan fill="#fff">得是两个</tspan>：验收那个没参与写，所以下得去手。<tspan fill="#fb923c">换个更聪明的模型也解决不了这件事。</tspan></text>
        <text x="86" y="338" fill="#94a3b8" font-size="10">多开一个 agent，图的是<tspan fill="#fff">各看各的资料、不互相带偏</tspan>，不是人多干得快 —— 代价是 4 倍 / 15 倍 token，所以动手的只留一个。</text>

        <rect x="16" y="352" width="1128" height="84" rx="8" fill="#0f172a"/>
        <rect x="16" y="352" width="1128" height="84" rx="8" fill="rgba(136,19,55,.34)" stroke="#fb7185" stroke-width="1.4"/>
        <text x="40" y="382" fill="#fb7185" font-size="21" font-weight="700">05</text>
        <text x="86" y="382" fill="#fff" font-size="15" font-weight="700">它能碰什么 —— 卡在真要动手那一刻</text>
        <text x="86" y="406" fill="#cbd5e1" font-size="10.5">默认只让读；要改文件、要联网、要碰敏感目录，<tspan fill="#fff">各配一个开关</tspan>。</text>
        <text x="86" y="426" fill="#94a3b8" font-size="10">标准不是"有没有副作用"，是<tspan fill="#fff">"这一步能不能撤回"</tspan> —— 撤不回的先问人。<tspan fill="#fb7185">写在提示词里没用：它分不清哪句是命令、哪句是数据。</tspan></text>
      </svg>
    </div>
  </div>
