<section class="slide" data-ch="CH3 原理" data-title="搭这个工位，你只有五个决定要做">
  <div class="s-head">
    <div class="s-kicker"><span class="dot amber"></span>CH 3 · 原理 · 落到手上</div>
    <h1 class="s-title">搭这个工位，真正要你拍板的只有<span class="hl-a">五件事</span></h1>
    <div class="s-sub">这五件拍错了，<b style="color:#e2e8f0">换多强的模型都救不回来</b>。</div>
  </div>

  <div class="s-body">
    <div class="figure plain">
      <svg viewBox="0 0 1160 452" xmlns="http://www.w3.org/2000/svg">
        <!-- ① 桌上摆什么 -->
        <rect x="16" y="10" width="1128" height="76" rx="8" fill="#0f172a"/>
        <rect x="16" y="10" width="1128" height="76" rx="8" fill="rgba(76,29,149,.3)" stroke="#a78bfa" stroke-width="1.4"/>
        <text x="40" y="40" fill="#a78bfa" font-size="21" font-weight="700">01</text>
        <text x="86" y="40" fill="#fff" font-size="15" font-weight="700">桌上摆什么 —— 资料摊太多，它反而找不着</text>
        <text x="86" y="66" fill="#cbd5e1" font-size="10.5"><tspan fill="#fff">塞得进去 ≠ 它找得到</tspan>：窗口从 128k 拉到 1M，长文里找答案的准确率从 91.8% 掉到 54.0%。只摆这一步用得上的。</text>

        <!-- ② 什么时候算干完 -->
        <rect x="16" y="94" width="1128" height="76" rx="8" fill="#0f172a"/>
        <rect x="16" y="94" width="1128" height="76" rx="8" fill="rgba(6,78,59,.34)" stroke="#34d399" stroke-width="1.4"/>
        <text x="40" y="124" fill="#34d399" font-size="21" font-weight="700">02</text>
        <text x="86" y="124" fill="#fff" font-size="15" font-weight="700">什么时候算干完 —— 得你定，别指望它自觉</text>
        <text x="86" y="150" fill="#cbd5e1" font-size="10.5">最常见的收场是<tspan fill="#fff">它不再要工具了</tspan>。<tspan fill="#fbbf24">OpenAI 默认最多转 10 圈，Claude 默认不限</tspan> —— 两家的胆量是反的。</text>

        <!-- ③ 走错了怎么退 -->
        <rect x="16" y="178" width="1128" height="76" rx="8" fill="#0f172a"/>
        <rect x="16" y="178" width="1128" height="76" rx="8" fill="rgba(8,51,68,.34)" stroke="#22d3ee" stroke-width="1.4"/>
        <text x="40" y="208" fill="#22d3ee" font-size="21" font-weight="700">03</text>
        <text x="86" y="208" fill="#fff" font-size="15" font-weight="700">走错了怎么退 —— 聊天记录要能长岔路</text>
        <text x="86" y="234" fill="#cbd5e1" font-size="10.5">记录<tspan fill="#fff">只往后加，从不改旧的</tspan>，所以能翻回三步之前换个思路。但退得回的只有话，<tspan fill="#fb7185">改过的文件退不回</tspan> —— 还得配 git 和沙箱。</text>

        <!-- ④ 谁来判对错 -->
        <rect x="16" y="262" width="1128" height="76" rx="8" fill="#0f172a"/>
        <rect x="16" y="262" width="1128" height="76" rx="8" fill="rgba(124,45,18,.32)" stroke="#fb923c" stroke-width="1.4"/>
        <text x="40" y="292" fill="#fb923c" font-size="21" font-weight="700">04</text>
        <text x="86" y="292" fill="#fff" font-size="15" font-weight="700">谁来验收 —— 让它自己判，它只会说干得挺好</text>
        <text x="86" y="318" fill="#cbd5e1" font-size="10.5">干活的和验收的<tspan fill="#fff">得是两个</tspan>，验收那个没参与写、下得去手。多开一个是为了<tspan fill="#fff">各看各的资料不带偏</tspan>，代价是 <tspan fill="#fbbf24">4 倍 / 15 倍</tspan> token。</text>

        <!-- ⑤ 它能碰什么 -->
        <rect x="16" y="346" width="1128" height="76" rx="8" fill="#0f172a"/>
        <rect x="16" y="346" width="1128" height="76" rx="8" fill="rgba(136,19,55,.34)" stroke="#fb7185" stroke-width="1.4"/>
        <text x="40" y="376" fill="#fb7185" font-size="21" font-weight="700">05</text>
        <text x="86" y="376" fill="#fff" font-size="15" font-weight="700">它能碰什么 —— 卡在真要动手那一刻</text>
        <text x="86" y="402" fill="#cbd5e1" font-size="10.5">默认只让读，改文件、联网各配一个开关。看的不是有没有副作用，是<tspan fill="#fff">"这一步能不能撤回"</tspan>。<tspan fill="#fb7185">写在提示词里没用 —— 它分不清命令和数据</tspan>。</text>
      </svg>
    </div>
  </div>

  <div class="s-foot">
    <span class="src">Chroma 上下文腐化实验 · Google 官方模型页（128k→1M）· OpenAI / Claude Agent SDK 默认值 · Anthropic 多智能体博客（4× / 15×）· 取证见 research/</span>
    <span class="spacer"></span>
    <span class="pg"></span>
  </div>
</section>
