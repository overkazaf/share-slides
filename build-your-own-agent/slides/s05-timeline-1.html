<section class="slide" data-ch="CH2 演进" data-title="演进 I（2022 – 2023）：从会推理，到会动手，然后撞墙">
  <div class="s-head">
    <div class="s-kicker"><span class="dot amber"></span>CH 2 · 演进 · 第一幕</div>
    <h1 class="s-title">从<span class="hl">会推理</span>，到<span class="hl-e">会动手</span>，然后<span class="hl-r">撞墙</span></h1>
    <div class="s-sub">一年三步，每步只记一件事 —— <b style="color:#e2e8f0">后来所有人要解决的问题，都是这一年暴露的</b>。</div>
  </div>

  <div class="s-body">
    <div class="figure plain">
      <svg viewBox="0 0 1160 460" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="ar-t1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
          </marker>
        </defs>

        <path d="M 372 160 L 392 160" stroke="#475569" stroke-width="1.2" marker-end="url(#ar-t1)"/>
        <path d="M 768 160 L 788 160" stroke="#475569" stroke-width="1.2" marker-end="url(#ar-t1)"/>

        <!-- ① 会推理 -->
        <rect x="16" y="16" width="356" height="288" rx="9" fill="#0f172a"/>
        <rect x="16" y="16" width="356" height="288" rx="9" fill="rgba(8,51,68,.34)" stroke="#22d3ee" stroke-width="1.5"/>
        <text x="40" y="44" fill="#22d3ee" font-size="9.5">① 2022 · 会推理</text>
        <text x="40" y="76" fill="#fff" font-size="19" font-weight="700">先解决「想清楚」</text>

        <text x="40" y="116" fill="#22d3ee" font-size="11" font-weight="700">2022-10-06　ReAct 预印本</text>
        <text x="40" y="138" fill="#cbd5e1" font-size="10.5">推理一步、动手一步、<tspan fill="#fff">看反馈再推理</tspan></text>
        <text x="40" y="158" fill="#94a3b8" font-size="10">今天所有 agent 的主循环都是它的后代</text>

        <text x="40" y="196" fill="#94a3b8" font-size="10.5">2022-11-30　ChatGPT 发布 —— 观众到齐了</text>

        <rect x="40" y="222" width="308" height="60" rx="6" fill="rgba(2,6,23,.55)" stroke="#1e293b" stroke-width="1"/>
        <text x="56" y="244" fill="#64748b" font-size="9.5">这一年回答的是：</text>
        <text x="56" y="266" fill="#e2e8f0" font-size="11.5">能不能<tspan fill="#22d3ee" font-weight="700">想清楚</tspan>、说出该用哪个工具</text>

        <!-- ② 会动手 -->
        <rect x="392" y="16" width="376" height="288" rx="9" fill="#0f172a"/>
        <rect x="392" y="16" width="376" height="288" rx="9" fill="rgba(136,19,55,.3)" stroke="#fb7185" stroke-width="1.5"/>
        <text x="416" y="44" fill="#fb7185" font-size="9.5">② 2023 春 · 会动手，然后撞墙</text>
        <text x="416" y="76" fill="#fff" font-size="19" font-weight="700">自主 agent 的三个月</text>

        <text x="416" y="116" fill="#fb7185" font-size="11" font-weight="700">2023-03-16　AutoGPT 首次提交</text>
        <text x="416" y="138" fill="#cbd5e1" font-size="10.5">提交信息只有三个词：<tspan fill="#fff" font-weight="700">"Initial prompt."</tspan></text>
        <text x="416" y="158" fill="#94a3b8" font-size="10">那一年的信念，全在这三个词里</text>

        <text x="416" y="196" fill="#fbbf24" font-size="11" font-weight="700">2023-04-22　破 10 万 star，同期开始唱衰</text>
        <text x="416" y="216" fill="#94a3b8" font-size="10">最热的那个月，也是失望开始的那个月</text>

        <rect x="416" y="234" width="328" height="52" rx="6" fill="rgba(2,6,23,.55)" stroke="#7f1d3a" stroke-width="1"/>
        <text x="432" y="254" fill="#fb7185" font-size="9.5">它没做到的三件事：</text>
        <text x="432" y="274" fill="#e2e8f0" font-size="11.5">跑得动，但<tspan fill="#fff" font-weight="700">停不下来 · 记不住 · 说不清</tspan></text>

        <!-- ③ 被量化 -->
        <rect x="788" y="16" width="356" height="288" rx="9" fill="#0f172a"/>
        <rect x="788" y="16" width="356" height="288" rx="9" fill="rgba(6,78,59,.32)" stroke="#34d399" stroke-width="1.5"/>
        <text x="812" y="44" fill="#34d399" font-size="9.5">③ 2023 中后 · 终于有了尺子</text>
        <text x="812" y="76" fill="#fff" font-size="19" font-weight="700">差距被量化了</text>

        <text x="812" y="106" fill="#34d399" font-size="11" font-weight="700">2023-06-13　Function Calling 发布</text>
        <text x="812" y="126" fill="#94a3b8" font-size="9.5">在这之前：模型只能"说"它想调什么，你得写正则去抠，还常抠错</text>
        <text x="812" y="143" fill="#cbd5e1" font-size="9.5">在这之后：模型直接吐出<tspan fill="#fff">结构化的调用</tspan>，调工具成了 API 能力</text>

        <text x="812" y="173" fill="#34d399" font-size="11" font-weight="700">2023-11-21　GAIA 基准发布</text>
        <text x="812" y="192" fill="#94a3b8" font-size="9.5">题目是"要多步才能查到答案"那种：翻网页、读文件、动手算</text>
        <rect x="812" y="200" width="308" height="34" rx="6" fill="rgba(2,6,23,.6)" stroke="#fb7185" stroke-width="1.2"/>
        <text x="836" y="222" fill="#e2e8f0" font-size="12.5">普通人 <tspan fill="#34d399" font-weight="700" font-size="15">92%</tspan>　vs　当时最强模型 + 插件 <tspan fill="#fb7185" font-weight="700" font-size="15">15%</tspan></text>

        <rect x="812" y="242" width="308" height="58" rx="6" fill="rgba(2,6,23,.55)" stroke="#1e293b" stroke-width="1"/>
        <text x="828" y="261" fill="#94a3b8" font-size="9.5">差到这个程度，<tspan fill="#fff">已经不可能靠改几句提示词补上</tspan>。</text>
        <text x="828" y="280" fill="#34d399" font-size="9.5">于是行业第一次公开承认：</text>
        <text x="828" y="296" fill="#e2e8f0" font-size="11.5">"<tspan fill="#fff" font-weight="700">不是 prompt 不够好，是缺一整套工程</tspan>"</text>

        <!-- 收口 -->
        <path d="M 16 336 L 1144 336" stroke="#1e293b" stroke-width="1"/>
        <text x="16" y="368" fill="#fb7185" font-size="11" font-weight="700">当年的信念</text>
        <text x="140" y="368" fill="#94a3b8" font-size="12">"模型够强 + prompt 够好 = agent 能自主完成任务"</text>
        <text x="16" y="404" fill="#34d399" font-size="11" font-weight="700">留下的教训</text>
        <text x="140" y="404" fill="#e2e8f0" font-size="13">自主性不稀缺 —— <tspan fill="#fff" font-weight="700">可控、可观测、可复现</tspan>才稀缺。</text>
        <text x="140" y="428" fill="#94a3b8" font-size="12">而这三样<tspan fill="#34d399" font-weight="700">不在模型里，在你写的那层壳里</tspan>。</text>
      </svg>
    </div>
  </div>
