<section class="slide" data-ch="CH3 原理" data-title="记忆与纠偏：让 agent 记得住，也拦得住">
  <div class="s-head">
    <div class="s-kicker"><span class="dot violet"></span>CH 3 · 原理 · L4 / L6</div>
    <h1 class="s-title">记忆分<span class="hl-v">三个尺度</span>，纠偏分<span class="hl-r">两个时机</span></h1>
    <div class="s-sub">"记不住"和"停不下来"是第一幕留下的两个病。今天它们各自有了成体系的解法 —— 而且都不在模型里。</div>
  </div>

  <div class="s-body">
    <div class="cols">
      <!-- ===== 左：记忆三尺度 ===== -->
      <div class="figure">
        <svg viewBox="0 0 560 492" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="ar-mm" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
              <polygon points="0 0, 8 3, 0 6" fill="#a78bfa"/>
            </marker>
          </defs>
          <g transform="translate(-11.7,-10.0) scale(1.0417)">
          <g transform="translate(0,34)">
          <text x="16" y="22" fill="#a78bfa" font-size="10.5" font-weight="600">记忆的三个尺度</text>
          <text x="16" y="38" fill="#64748b" font-size="8.5">每一层的设计问题都是同一个：<tspan fill="#94a3b8">跨过这个边界，什么必须活下来？</tspan></text>

          <path d="M 268 118 L 268 138" stroke="#a78bfa" stroke-width="1.4" marker-end="url(#ar-mm)"/>
          <path d="M 268 232 L 268 252" stroke="#a78bfa" stroke-width="1.4" marker-end="url(#ar-mm)"/>

          <!-- 轮内 -->
          <rect x="16" y="52" width="528" height="66" rx="7" fill="#0f172a"/>
          <rect x="16" y="52" width="528" height="66" rx="7" fill="rgba(8,51,68,.4)" stroke="#22d3ee" stroke-width="1.5"/>
          <text x="32" y="74" fill="#22d3ee" font-size="9" font-weight="600">尺度一 · 轮内</text>
          <text x="528" y="74" fill="#475569" font-size="8.5" text-anchor="end">秒 ~ 分钟</text>
          <text x="32" y="94" fill="#fff" font-size="11.5" font-weight="600">上下文窗口</text>
          <text x="32" y="110" fill="#94a3b8" font-size="8.5">这一次请求能看到的全部。它不是仓库，是注意力预算 —— 越满越钝</text>

          <text x="286" y="133" fill="#64748b" font-size="8.5">跨轮：靠"只追加"活下来</text>

          <!-- 会话内 -->
          <rect x="16" y="146" width="528" height="86" rx="7" fill="#0f172a"/>
          <rect x="16" y="146" width="528" height="86" rx="7" fill="rgba(76,29,149,.4)" stroke="#a78bfa" stroke-width="1.5"/>
          <text x="32" y="168" fill="#a78bfa" font-size="9" font-weight="600">尺度二 · 会话内</text>
          <text x="528" y="168" fill="#475569" font-size="8.5" text-anchor="end">小时</text>
          <text x="32" y="188" fill="#fff" font-size="11.5" font-weight="600">会话树 + 压缩</text>
          <text x="32" y="206" fill="#94a3b8" font-size="8.5">只追加、不改写，所以能回溯、能分叉、能重放</text>
          <text x="32" y="222" fill="#94a3b8" font-size="8.5">满了就把旧历史换成摘要 —— 压缩本身也是树上的一个节点</text>

          <text x="286" y="247" fill="#64748b" font-size="8.5">跨会话：只有被显式"巩固"的才活下来</text>

          <!-- 跨会话 -->
          <rect x="16" y="260" width="528" height="96" rx="7" fill="#0f172a"/>
          <rect x="16" y="260" width="528" height="96" rx="7" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="1.5"/>
          <text x="32" y="282" fill="#34d399" font-size="9" font-weight="600">尺度三 · 跨会话</text>
          <text x="528" y="282" fill="#475569" font-size="8.5" text-anchor="end">天 ~ 永久</text>
          <text x="32" y="302" fill="#fff" font-size="11.5" font-weight="600">外部记忆</text>
          <text x="32" y="320" fill="#94a3b8" font-size="8.5">最朴素也最有效的形态：<tspan fill="#fff">文件</tspan>。写下来的东西天然可 review、可版本管理</text>
          <text x="32" y="336" fill="#94a3b8" font-size="8.5">更工程化的做法：<tspan fill="#34d399">工作记忆 → 情节记忆</tspan>的巩固机制 + 全文与向量混合召回</text>
          <text x="32" y="350" fill="#475569" font-size="8">oh-my-pi 的 mnemosyne 就是这一层，全本地、无云</text>

          <rect x="16" y="370" width="528" height="42" rx="6" fill="rgba(120,53,15,.2)" stroke="#fbbf24" stroke-width="1"/>
          <text x="32" y="390" fill="#fbbf24" font-size="9" font-weight="600">最容易犯的错</text>
          <text x="130" y="390" fill="#cbd5e1" font-size="9">把三个尺度混成一个"记忆系统"</text>
          <text x="32" y="405" fill="#94a3b8" font-size="8.5">它们的读写频率、可靠性要求、成本量级差好几个数量级，必须分开设计</text>
        
          </g>
        
          </g>
        
          </g>
        </svg>
      </div>

      <!-- ===== 右：纠偏两时机 ===== -->
      <div class="figure">
        <svg viewBox="0 0 560 492" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="ar-fx" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
              <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
            </marker>
            <marker id="ar-fx-r" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
              <polygon points="0 0, 8 3, 0 6" fill="#fb7185"/>
            </marker>
          </defs>
          <g transform="translate(-11.7,-10.0) scale(1.0417)">
          <g transform="translate(0,34)">
          <text x="16" y="22" fill="#fb7185" font-size="10.5" font-weight="600">纠偏的两个时机</text>
          <text x="16" y="38" fill="#64748b" font-size="8.5">共同前提：<tspan fill="#fff">让模型自己评自己，它会自我吹捧</tspan></text>

          <!-- 事中 -->
          <rect x="16" y="52" width="528" height="150" rx="7" fill="rgba(136,19,55,.16)" stroke="#fb7185" stroke-width="1.3"/>
          <text x="32" y="74" fill="#fb7185" font-size="10.5" font-weight="600">① 事中拦截 —— 在写出违规的那一刻</text>

          <path d="M 40 108 L 240 108" stroke="#34d399" stroke-width="3"/>
          <path d="M 240 108 L 330 108" stroke="#475569" stroke-width="3" stroke-dasharray="4,4"/>
          <circle cx="240" cy="108" r="7" fill="rgba(136,19,55,.9)" stroke="#fb7185" stroke-width="2"/>
          <text x="240" y="94" fill="#fb7185" font-size="9" text-anchor="middle" font-weight="600">违规 token</text>
          <text x="40" y="94" fill="#34d399" font-size="8.5">正在流式生成…</text>
          <text x="286" y="128" fill="#64748b" font-size="8.5" text-anchor="middle">后面的全部丢弃</text>
          <path d="M 330 118 L 350 118 L 350 142 L 40 142 L 40 122" fill="none" stroke="#fb7185" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#ar-fx-r)"/>
          <text x="200" y="158" fill="#fb7185" font-size="9" text-anchor="middle">立即打断 → 回滚 → 带着规则重跑这一轮</text>

          <text x="32" y="180" fill="#cbd5e1" font-size="9">好处：违规<tspan fill="#fff">从来没有进入过历史</tspan>，模型不会"看到自己犯过的错"再学一遍</text>
          <text x="32" y="194" fill="#475569" font-size="8">oh-my-pi 把它做成了 TTSR。代价：要在流式层做，实现复杂</text>

          <!-- 事后 -->
          <rect x="16" y="216" width="528" height="150" rx="7" fill="rgba(76,29,149,.18)" stroke="#a78bfa" stroke-width="1.3"/>
          <text x="32" y="238" fill="#a78bfa" font-size="10.5" font-weight="600">② 事后评审 —— 换一个脑子来看</text>

          <rect x="40" y="256" width="140" height="46" rx="6" fill="rgba(6,78,59,.45)" stroke="#34d399" stroke-width="1.4"/>
          <text x="110" y="276" fill="#fff" font-size="10" text-anchor="middle" font-weight="600">主 agent</text>
          <text x="110" y="292" fill="#94a3b8" font-size="8" text-anchor="middle">跑完这一轮</text>
          <path d="M 182 279 L 214 279" stroke="#64748b" stroke-width="1.3" marker-end="url(#ar-fx)"/>
          <rect x="218" y="256" width="150" height="46" rx="6" fill="rgba(76,29,149,.45)" stroke="#a78bfa" stroke-width="1.4"/>
          <text x="293" y="276" fill="#fff" font-size="10" text-anchor="middle" font-weight="600">第二个模型</text>
          <text x="293" y="292" fill="#c4b5fd" font-size="8" text-anchor="middle">只读这一轮的增量</text>
          <path d="M 370 279 L 402 279" stroke="#64748b" stroke-width="1.3" marker-end="url(#ar-fx)"/>
          <rect x="406" y="256" width="116" height="46" rx="6" fill="rgba(136,19,55,.45)" stroke="#fb7185" stroke-width="1.4"/>
          <text x="464" y="276" fill="#fff" font-size="10" text-anchor="middle" font-weight="600">异议 / 放行</text>
          <text x="464" y="292" fill="#94a3b8" font-size="8" text-anchor="middle">插回主线</text>

          <text x="32" y="326" fill="#cbd5e1" font-size="9">关键设计：评审方<tspan fill="#fbbf24">不共享</tspan>主 agent 的完整上下文。</text>
          <text x="32" y="342" fill="#cbd5e1" font-size="9">干净的上下文<tspan fill="#fff">反而更容易看出问题</tspan> —— 因为它没被主线的叙事说服过。</text>
          <text x="32" y="358" fill="#475569" font-size="8">这一条在 2026 年被 Cognition 自己写进了"实际有效的多 agent 模式"</text>

          <rect x="16" y="378" width="528" height="34" rx="6" fill="rgba(2,6,23,.7)" stroke="#334155" stroke-width="1"/>
          <text x="280" y="399" fill="#fbbf24" font-size="10" text-anchor="middle" font-weight="600">共同原则：结构性地分离"生成"和"评判"</text>
        
          </g>
        
          </g>
        
          </g>
        </svg>
      </div>
    </div>
  </div>

  <div class="s-foot">
    <span class="src">证据 · oh-my-pi <b>mnemopi</b>（双层记忆）/ <b>TTSR</b>（流式回滚）/ <b>advisor · watchdog</b>（增量评审）· Anthropic harness 系列（规划 / 生成 / 评判 分离）</span>

  </div>
</section>
