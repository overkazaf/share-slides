<section class="slide" data-ch="开篇" data-title="核心观点：结论先行">
  <div class="s-head">
    <div class="s-kicker"><span class="dot"></span>核心观点 · 先说结论</div>
    <h1 class="s-title">如果这场只记住五句话，是这五句</h1>
    <div class="s-sub">后面 30 多页都是在给这五句话找证据。你可以先看结论，再决定哪一章值得细看。</div>
  </div>

  <div class="s-body">
    <div class="figure plain">
      <svg viewBox="0 0 1160 502" xmlns="http://www.w3.org/2000/svg">
          <g transform="translate(-15.5,9.7) scale(1.0268)">
        <!-- ① -->
        <rect x="20" y="14" width="1120" height="82" rx="9" fill="#0f172a"/>
        <rect x="20" y="14" width="1120" height="82" rx="9" fill="rgba(8,51,68,.4)" stroke="#22d3ee" stroke-width="2"/>
        <text x="46" y="52" fill="#22d3ee" font-size="26" font-weight="700">01</text>
        <text x="96" y="48" fill="#fff" font-size="17" font-weight="700">模型决定能力上限，harness 决定你能兑现多少</text>
        <text x="96" y="72" fill="#94a3b8" font-size="10.5">有受控实验：16 个模型 × 180 个真实修 bug 任务，<tspan fill="#fff">只换"编辑工具格式"一个变量</tspan> ——</text>
        <text x="96" y="88" fill="#94a3b8" font-size="10.5">同一个模型从 <tspan fill="#fb7185" font-weight="700">6.7%</tspan> 变成 <tspan fill="#34d399" font-weight="700">68.3%</tspan>，全体平均 +15 个百分点。<tspan fill="#64748b">→ 第 13 页</tspan></text>

        <!-- ② -->
        <rect x="20" y="108" width="1120" height="76" rx="9" fill="#0f172a"/>
        <rect x="20" y="108" width="1120" height="76" rx="9" fill="rgba(76,29,149,.4)" stroke="#a78bfa" stroke-width="2"/>
        <text x="46" y="146" fill="#a78bfa" font-size="26" font-weight="700">02</text>
        <text x="96" y="142" fill="#fff" font-size="17" font-weight="700">上下文是预算，不是仓库</text>
        <text x="96" y="168" fill="#94a3b8" font-size="10.5">窗口里每个 token 都要和其余所有 token 建立关系，注意力是被摊薄的。<tspan fill="#fff">所有 context engineering 都是这一句的推论。</tspan><tspan fill="#64748b">　→ 第 17 页</tspan></text>

        <!-- ③ -->
        <rect x="20" y="196" width="1120" height="76" rx="9" fill="#0f172a"/>
        <rect x="20" y="196" width="1120" height="76" rx="9" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="2"/>
        <text x="46" y="234" fill="#34d399" font-size="26" font-weight="700">03</text>
        <text x="96" y="230" fill="#fff" font-size="17" font-weight="700">能写死的就别让模型猜</text>
        <text x="96" y="256" fill="#94a3b8" font-size="10.5">绝大多数"我需要一个 agent"的需求，其实是五种 workflow 模式之一 —— <tspan fill="#fff">更便宜、更可控、更好排查</tspan>。<tspan fill="#64748b">　→ 第 21 页</tspan></text>

        <!-- ④ -->
        <rect x="20" y="284" width="1120" height="76" rx="9" fill="#0f172a"/>
        <rect x="20" y="284" width="1120" height="76" rx="9" fill="rgba(120,53,15,.35)" stroke="#fbbf24" stroke-width="2"/>
        <text x="46" y="322" fill="#fbbf24" font-size="26" font-weight="700">04</text>
        <text x="96" y="318" fill="#fff" font-size="17" font-weight="700">你能给自己的领域造出验证器，agent 才真的能进来</text>
        <text x="96" y="344" fill="#94a3b8" font-size="10.5">coding 先落地，不是因为程序员多，是因为<tspan fill="#fff">编译器和测试天然就是验证器</tspan>。没有验证器的领域，agent 只会自信地胡说。<tspan fill="#64748b">　→ 第 26 页</tspan></text>

        <!-- ⑤ -->
        <rect x="20" y="372" width="1120" height="84" rx="9" fill="#0f172a"/>
        <rect x="20" y="372" width="1120" height="84" rx="9" fill="rgba(136,19,55,.4)" stroke="#fb7185" stroke-width="2"/>
        <text x="46" y="412" fill="#fb7185" font-size="26" font-weight="700">05</text>
        <text x="96" y="406" fill="#fff" font-size="17" font-weight="700">模型是租来的，工具是现成的 —— 但那层壳只能自己焊</text>
        <text x="96" y="432" fill="#94a3b8" font-size="10.5">这就是为什么值得自己造一个。pi 官网那句话说得最准：</text>
        <text x="96" y="450" fill="#22d3ee" font-size="12" font-weight="600">"There are many agent harnesses but this one is yours"<tspan fill="#64748b" font-size="10.5" font-weight="400">　→ 第 30 页 / 第 37 页</tspan></text>
      
          </g>
        </svg>
