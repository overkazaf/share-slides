<section class="slide" data-ch="开篇" data-title="核心观点：结论先行">
  <div class="s-head">
    <div class="s-kicker"><span class="dot"></span>核心观点 · 先说结论</div>
    <h1 class="s-title">如果这场只记住七句话，是这七句</h1>
    <div class="s-sub">后面 30 多页都在给这七句话找证据。</div>
  </div>

  <div class="s-body">
    <div class="figure plain">
      <svg viewBox="0 0 1160 502" xmlns="http://www.w3.org/2000/svg">
        <!-- ① 定义判据 -->
        <rect x="20" y="2" width="1120" height="64" rx="9" fill="#0f172a"/>
        <rect x="20" y="2" width="1120" height="64" rx="9" fill="rgba(8,51,68,.4)" stroke="#22d3ee" stroke-width="2"/>
        <text x="46" y="42" fill="#22d3ee" font-size="24" font-weight="700">01</text>
        <text x="96" y="30" fill="#fff" font-size="16" font-weight="700">是不是 agent，只看下一步由代码写死、还是模型现场决定</text>
        <text x="96" y="52" fill="#94a3b8" font-size="10.5">全场所有取舍的坐标轴。<tspan fill="#fff">决策权是连续谱，不是标签。</tspan><tspan fill="#64748b">　→ 第 7 页</tspan></text>

        <!-- ② harness -->
        <rect x="20" y="74" width="1120" height="64" rx="9" fill="#0f172a"/>
        <rect x="20" y="74" width="1120" height="64" rx="9" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="2"/>
        <text x="46" y="114" fill="#34d399" font-size="24" font-weight="700">02</text>
        <text x="96" y="102" fill="#fff" font-size="16" font-weight="700">模型决定能力上限，harness 决定你能兑现多少</text>
        <text x="96" y="124" fill="#94a3b8" font-size="10.5">最弱模型 <tspan fill="#fb7185" font-weight="700">6.7%</tspan> → <tspan fill="#34d399" font-weight="700">68.3%</tspan>；官方榜 22 模型换 harness <tspan fill="#fff">中位数只挪 5.39 分</tspan>。<tspan fill="#fff">主项买不到差异化，次项才是你的。</tspan><tspan fill="#64748b">　→ 第 13 页</tspan></text>

        <!-- ③ 上下文 -->
        <rect x="20" y="146" width="1120" height="64" rx="9" fill="#0f172a"/>
        <rect x="20" y="146" width="1120" height="64" rx="9" fill="rgba(76,29,149,.4)" stroke="#a78bfa" stroke-width="2"/>
        <text x="46" y="186" fill="#a78bfa" font-size="24" font-weight="700">03</text>
        <text x="96" y="174" fill="#fff" font-size="16" font-weight="700">上下文是注意力预算，不是仓库 —— 装得下不代表找得到</text>
        <text x="96" y="196" fill="#94a3b8" font-size="10.5">多一个干扰项就低于 baseline。<tspan fill="#fff">context engineering 都是它的推论。</tspan><tspan fill="#64748b">　→ 第 18 页</tspan></text>

        <!-- ④ 写死 -->
        <rect x="20" y="218" width="1120" height="64" rx="9" fill="#0f172a"/>
        <rect x="20" y="218" width="1120" height="64" rx="9" fill="rgba(120,53,15,.35)" stroke="#fbbf24" stroke-width="2"/>
        <text x="46" y="258" fill="#fbbf24" font-size="24" font-weight="700">04</text>
        <text x="96" y="246" fill="#fff" font-size="16" font-weight="700">别问该不该上 agent，要问这一段决策能不能写死</text>
        <text x="96" y="268" fill="#94a3b8" font-size="10.5">多数「我需要 agent」其实是五种 workflow 模式之一。<tspan fill="#fff">正解：workflow 骨架 + 局部 agent。</tspan><tspan fill="#64748b">　→ 第 22 页</tspan></text>

        <!-- ⑤ 生成/评判分离 -->
        <rect x="20" y="290" width="1120" height="64" rx="9" fill="#0f172a"/>
        <rect x="20" y="290" width="1120" height="64" rx="9" fill="rgba(124,45,18,.35)" stroke="#fb923c" stroke-width="2"/>
        <text x="46" y="330" fill="#fb923c" font-size="24" font-weight="700">05</text>
        <text x="96" y="318" fill="#fff" font-size="16" font-weight="700">让模型自评只会自我吹捧 —— 生成与评判必须结构性分开</text>
        <text x="96" y="340" fill="#94a3b8" font-size="10.5">唯一一条<tspan fill="#fff">更强的模型也解决不了</tspan>：evaluator 有用，因为它没有沉没成本偏见。<tspan fill="#64748b">　→ 第 23 页 / 第 25 页</tspan></text>

        <!-- ⑥ 验证器 -->
        <rect x="20" y="362" width="1120" height="64" rx="9" fill="#0f172a"/>
        <rect x="20" y="362" width="1120" height="64" rx="9" fill="rgba(22,78,99,.4)" stroke="#22d3ee" stroke-width="2"/>
        <text x="46" y="402" fill="#22d3ee" font-size="24" font-weight="700">06</text>
        <text x="96" y="390" fill="#fff" font-size="16" font-weight="700">能给自己的领域造出验证器，agent 才真的能进来</text>
        <text x="96" y="412" fill="#94a3b8" font-size="10.5"><tspan fill="#fff">编译器和测试天然是验证器</tspan>，所以 coding 先落地；且必须 <tspan fill="#fff">agent 够不着</tspan> —— 看得见的会退化成优化目标。<tspan fill="#64748b">　→ 第 27 页</tspan></text>

        <!-- ⑦ 那层壳 -->
        <rect x="20" y="434" width="1120" height="64" rx="9" fill="#0f172a"/>
        <rect x="20" y="434" width="1120" height="64" rx="9" fill="rgba(136,19,55,.4)" stroke="#fb7185" stroke-width="2"/>
        <text x="46" y="474" fill="#fb7185" font-size="24" font-weight="700">07</text>
        <text x="96" y="462" fill="#fff" font-size="16" font-weight="700">模型是租来的，工具是现成的 —— 但那层壳只能自己焊</text>
        <text x="96" y="484" fill="#94a3b8" font-size="10.5">通用层开源已做完，剩下<tspan fill="#fff">只有内行才知道的约束</tspan>。<tspan fill="#22d3ee">"There are many agent harnesses but this one is yours"</tspan><tspan fill="#64748b">　→ 第 31 页 / 第 39 页</tspan></text>
      </svg>
    </div>
  </div>

  <div class="s-foot">
    <span class="src">每一句都挂着可核查的出处 · 研究笔记一同开源</span>

</section>
