          <text x="30" y="164" fill="#cbd5e1" font-size="8.5"><tspan fill="#5b8f78" font-weight="600">解</tspan> 本地光栅成点阵图给 vision 读，零调用</text>

          <text x="30" y="226" fill="#94a3b8" font-size="8.5"><tspan fill="#64748b" font-weight="600">卡</tspan> 多机多账号互刷 token，凭据难藏</text>
          <text x="30" y="241" fill="#e2b04a" font-size="8.5"><tspan fill="#a1731f" font-weight="600">判</tspan> 根因是写者不止一个，人人能刷必废</text>
          <text x="30" y="256" fill="#cbd5e1" font-size="8.5"><tspan fill="#5b8f78" font-weight="600">解</tspan> broker 唯一写者，客户端只拿到哨兵</text>

          <rect x="244" y="192" width="216" height="76" rx="6" fill="rgba(120,53,15,.28)" stroke="#fbbf24" stroke-width="1.2"/>

          <text x="258" y="226" fill="#94a3b8" font-size="8.5"><tspan fill="#64748b" font-weight="600">卡</tspan> 长尾开源模型原生 tool call 不稳</text>
          <text x="258" y="241" fill="#e2b04a" font-size="8.5"><tspan fill="#a1731f" font-weight="600">判</tspan> 他赌训练时见过的语法比 tools 字段稳</text>
          <text x="258" y="256" fill="#cbd5e1" font-size="8.5"><tspan fill="#5b8f78" font-weight="600">解</tspan> 关掉 native tools，用它自己的写法</text>

          <rect x="472" y="192" width="216" height="76" rx="6" fill="rgba(136,19,55,.28)" stroke="#fb7185" stroke-width="1.2"/>
          <text x="486" y="209" fill="#fb7185" font-size="10" font-weight="600">TTSR</text>
          <text x="486" y="226" fill="#94a3b8" font-size="8.5"><tspan fill="#64748b" font-weight="600">卡</tspan> 规则写进 prompt 照样违反</text>
          <text x="486" y="241" fill="#e2b04a" font-size="8.5"><tspan fill="#a1731f" font-weight="600">判</tspan> 规则只是建议，约束得有执行边界</text>
          <text x="486" y="256" fill="#cbd5e1" font-size="8.5"><tspan fill="#5b8f78" font-weight="600">解</tspan> 流式逐 token 匹配，命中即中断重跑</text>

          <rect x="16" y="284" width="216" height="76" rx="6" fill="rgba(6,78,59,.28)" stroke="#34d399" stroke-width="1.2"/>
          <text x="30" y="301" fill="#34d399" font-size="10" font-weight="600">工具两级加载</text>

          <text x="30" y="333" fill="#e2b04a" font-size="8.5"><tspan fill="#a1731f" font-weight="600">判</tspan> 病在目录常驻，工具越多边际收益越负</text>

          <text x="16" y="20" fill="#34d399" font-size="10.5" font-weight="600">最该抄的：FORK.md</text>
          <text x="16" y="36" fill="#94a3b8" font-size="8.5">同一个改动落在哪一层，<tspan fill="#fff">决定你以后每次上游更新要花多少时间</tspan></text>

          <text x="220" y="62" fill="#fbbf24" font-size="10" text-anchor="middle" font-weight="600">"pick the lowest tier that works"</text>

          <!-- Tier 2 -->
          <rect x="16" y="80" width="408" height="50" rx="6" fill="#0f172a"/>
          <rect x="16" y="80" width="408" height="50" rx="6" fill="rgba(136,19,55,.34)" stroke="#fb7185" stroke-width="1.4"/>
          <text x="32" y="99" fill="#fb7185" font-size="10.5" font-weight="700">Tier 2 · 直接改上游的逻辑</text>
          <text x="32" y="114" fill="#cbd5e1" font-size="8.5">代价：上游每动一次，你都要重解一次冲突</text>
          <text x="32" y="126" fill="#fb7185" font-size="8">omp 给自己定的上限：全仓最多 4 处</text>

          <!-- Tier 1 -->
          <rect x="16" y="138" width="408" height="50" rx="6" fill="#0f172a"/>
          <rect x="16" y="138" width="408" height="50" rx="6" fill="rgba(120,53,15,.32)" stroke="#fbbf24" stroke-width="1.4"/>
          <text x="32" y="157" fill="#fbbf24" font-size="10.5" font-weight="700">Tier 1 · 只在上游文件里加一两行</text>
          <text x="32" y="172" fill="#cbd5e1" font-size="8.5">比如注册表加一行、类型多一个字段</text>
          <text x="32" y="184" fill="#94a3b8" font-size="8">代价：上游改了多半能自动合，偶尔手动</text>

          <!-- Tier 0 -->
          <rect x="16" y="196" width="408" height="54" rx="6" fill="#0f172a"/>
          <rect x="16" y="196" width="408" height="54" rx="6" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="2"/>
          <text x="32" y="215" fill="#34d399" font-size="11" font-weight="700">Tier 0 · 只往自己的目录里加文件</text>
          <text x="32" y="231" fill="#cbd5e1" font-size="8.5">不碰上游任何一个文件，<tspan fill="#fff">物理上不可能冲突</tspan></text>
          <text x="32" y="245" fill="#34d399" font-size="8">能做到这层就做这层 —— 这就是那句英文的意思</text>

          <text x="30" y="284" fill="#34d399" font-size="9.5" font-weight="600">最漂亮的一招：把 Tier 2 变成 0</text>
          <text x="30" y="300" fill="#cbd5e1" font-size="8.5">① 在上游核心只加<tspan fill="#fff">一行钩子</tspan>（一个空的插槽），真逻辑写进自己的扩展</text>
          <text x="30" y="314" fill="#cbd5e1" font-size="8.5">② 把这一行钩子<tspan fill="#fff">提 PR 给上游</tspan></text>
          <text x="30" y="328" fill="#cbd5e1" font-size="8.5">③ 上游合了之后，<tspan fill="#fbbf24">你的核心补丁归零</tspan> —— 功能还在，冲突没了</text>

          <rect x="16" y="367" width="408" height="72" rx="6" fill="rgba(76,29,149,.16)" stroke="#a78bfa" stroke-width="1"/>
          <text x="30" y="386" fill="#a78bfa" font-size="9.5" font-weight="600">这一页真正能搬走的</text>

          <text x="30" y="422" fill="#cbd5e1" font-size="8.5">能搬走的不是这些功能，是<tspan fill="#fff">这套成本模型</tspan>：先问「能不能不碰上游」。</text>
