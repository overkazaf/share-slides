<section class="slide" data-ch="CH3 原理" data-title="一个类比：一句话 → 一台能干活的机器">
  <div class="s-head">
    <div class="s-kicker"><span class="dot emerald"></span>CH 3 · 原理 · 一个类比</div>
    <h1 class="s-title">从<span class="hl">一句 prompt</span>，到<span class="hl-e">一台能干活的机器</span></h1>
    <div class="s-sub">这些名词是从小往大搭的，<b style="color:#e2e8f0">每一层解决的都是上一层解决不了的那个具体问题</b>。先把它们串成一句人话，再落到你要拍板的事。</div>
  </div>

  <div class="s-body">
    <div class="figure plain">
      <svg viewBox="0 0 1160 448" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="ar-an" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a78bfa"/></marker>
          <marker id="ar-an-e" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#34d399"/></marker>
          <marker id="ar-an-o" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#fb923c"/></marker>
        </defs>
        <!-- 阶梯 -->
        <text x="16" y="16" fill="#64748b" font-size="9">它们不是并列的十个名词 —— 是一层套一层：<tspan fill="#94a3b8">里面那圈决定「能不能干成」，外面那圈决定「能不能长期用」</tspan></text>

        <!-- 最外：harness -->
        <rect x="16" y="24" width="1128" height="158" rx="10" fill="none" stroke="#e2e8f0" stroke-width="1.4" stroke-dasharray="7,5"/>
        <text x="30" y="42" fill="#e2e8f0" font-size="10" font-weight="700">harness · 把下面这些装进一台机器，并决定它们怎么配合</text>

        <!-- memory -->
        <rect x="32" y="56" width="140" height="102" rx="8" fill="rgba(76,29,149,.32)" stroke="#a78bfa" stroke-width="1.3"/>
        <text x="46" y="78" fill="#a78bfa" font-size="10.5" font-weight="700">memory</text>
        <text x="46" y="98" fill="#cbd5e1" font-size="8.5">跨会话记着</text>
        <text x="46" y="113" fill="#cbd5e1" font-size="8.5">上次的结论</text>
        <text x="46" y="140" fill="#64748b" font-size="8">下次开工时</text>
        <text x="46" y="152" fill="#64748b" font-size="8">再倒进桌子</text>
        <path d="M 176 107 L 202 107" stroke="#a78bfa" stroke-width="1.3" marker-end="url(#ar-an)"/>

        <!-- context -->
        <rect x="206" y="56" width="252" height="102" rx="8" fill="rgba(34,211,238,.14)" stroke="#22d3ee" stroke-width="1.4"/>
        <text x="220" y="78" fill="#22d3ee" font-size="10.5" font-weight="700">context · 这一轮摆上桌的东西</text>
        <rect x="220" y="88" width="106" height="26" rx="5" fill="rgba(2,6,23,.6)" stroke="#334155" stroke-width="1"/>
        <text x="273" y="105" fill="#fff" font-size="9" text-anchor="middle">prompt 你这句话</text>
        <rect x="334" y="88" width="110" height="26" rx="5" fill="rgba(2,6,23,.6)" stroke="#334155" stroke-width="1"/>
        <text x="389" y="105" fill="#cbd5e1" font-size="9" text-anchor="middle">之前的对话</text>
        <rect x="220" y="120" width="106" height="26" rx="5" fill="rgba(2,6,23,.6)" stroke="#334155" stroke-width="1"/>
        <text x="273" y="137" fill="#cbd5e1" font-size="9" text-anchor="middle">工具说明书</text>
        <rect x="334" y="120" width="110" height="26" rx="5" fill="rgba(251,191,36,.16)" stroke="#fbbf24" stroke-width="1"/>
        <text x="389" y="137" fill="#fbbf24" font-size="9" text-anchor="middle">SKILL 目录</text>
        <path d="M 462 107 L 490 107" stroke="#34d399" stroke-width="1.3" marker-end="url(#ar-an-e)"/>

        <!-- loop -->
        <rect x="494" y="56" width="286" height="102" rx="8" fill="rgba(6,78,59,.3)" stroke="#34d399" stroke-width="1.6"/>
        <text x="508" y="78" fill="#34d399" font-size="10.5" font-weight="700">loop · 拿这桌东西转圈</text>
        <text x="508" y="98" fill="#cbd5e1" font-size="9">模型看一眼 → 决定下一步 → <tspan fill="#fff">调工具</tspan> → 结果回桌上</text>
        <rect x="508" y="108" width="128" height="38" rx="5" fill="rgba(120,53,15,.34)" stroke="#fbbf24" stroke-width="1.1"/>
        <text x="572" y="124" fill="#fbbf24" font-size="9" text-anchor="middle" font-weight="700">tools · function calling</text>
        <text x="572" y="139" fill="#94a3b8" font-size="8" text-anchor="middle">循环里"动手"那一步</text>
        <rect x="644" y="108" width="122" height="38" rx="5" fill="rgba(2,6,23,.6)" stroke="#334155" stroke-width="1"/>
        <text x="705" y="124" fill="#e2e8f0" font-size="9" text-anchor="middle">什么时候算干完</text>
        <text x="705" y="139" fill="#94a3b8" font-size="8" text-anchor="middle">判停：你定，不是它定</text>
        <path d="M 636 160 L 332 160" stroke="#34d399" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ar-an-e)"/>
        <text x="484" y="174" fill="#64748b" font-size="8" text-anchor="middle">每转一圈，结果都回灌进 context —— 所以桌子会越堆越满</text>

        <!-- graph -->
        <rect x="792" y="56" width="150" height="102" rx="8" fill="rgba(8,51,68,.34)" stroke="#22d3ee" stroke-width="1.3"/>
        <text x="806" y="78" fill="#22d3ee" font-size="10.5" font-weight="700">graph</text>
        <text x="806" y="98" fill="#cbd5e1" font-size="8.5">给这个圈加两件事：</text>
        <text x="806" y="116" fill="#fff" font-size="8.5">走错了能退回去</text>
        <text x="806" y="132" fill="#fff" font-size="8.5">几条路能同时走</text>
        <text x="806" y="152" fill="#64748b" font-size="8">管的是「怎么走」</text>

        <!-- workflow / 多 agent -->
        <rect x="954" y="56" width="176" height="102" rx="8" fill="rgba(136,19,55,.3)" stroke="#fb7185" stroke-width="1.3"/>
        <text x="968" y="78" fill="#fb7185" font-size="10.5" font-weight="700">workflow / 多 agent</text>
        <text x="968" y="98" fill="#cbd5e1" font-size="8.5">一个圈不够用时，</text>
        <text x="968" y="114" fill="#cbd5e1" font-size="8.5">把<tspan fill="#fff">好几个圈</tspan>串起来</text>
        <text x="968" y="134" fill="#94a3b8" font-size="8.5">谁先谁后、谁只出主意</text>
        <text x="968" y="152" fill="#64748b" font-size="8">管的是「几个一起怎么排」</text>

        <!-- MCP / Hook 插口 -->
        <path d="M 572 46 L 572 56" stroke="#fb923c" stroke-width="1.2" marker-end="url(#ar-an-o)"/>
        <path d="M 389 46 L 389 56" stroke="#fb923c" stroke-width="1.2" marker-end="url(#ar-an-o)"/>
        <text x="620" y="44" fill="#fb923c" font-size="9">MCP · Hook · 扩展点 —— 往<tspan fill="#fff">工具</tspan>和<tspan fill="#fff">这张桌子</tspan>上插东西的插口</text>

        <!-- 类比 -->
        <path d="M 16 182 L 1144 182" stroke="#1e293b" stroke-width="1"/>
        <text x="16" y="208" fill="#fbbf24" font-size="11" font-weight="700">换个说法：请了个记性很差、但手很快的新同事</text>

        <rect x="16" y="222" width="352" height="196" rx="8" fill="#0f172a"/>
        <rect x="16" y="222" width="352" height="196" rx="8" fill="rgba(8,51,68,.28)" stroke="#22d3ee" stroke-width="1.3"/>
        <text x="36" y="246" fill="#22d3ee" font-size="9.5" font-weight="600">他的问题</text>
        <text x="36" y="272" fill="#e2e8f0" font-size="10.5">· 聪明，但<tspan fill="#fff">一觉醒来什么都不记得</tspan></text>
        <text x="36" y="296" fill="#e2e8f0" font-size="10.5">· 桌上摊太多资料就<tspan fill="#fff">看串行</tspan></text>
        <text x="36" y="320" fill="#e2e8f0" font-size="10.5">· 只会说，<tspan fill="#fff">不给工具就动不了手</tspan></text>
        <text x="36" y="344" fill="#e2e8f0" font-size="10.5">· 干错了<tspan fill="#fff">不知道自己错了</tspan></text>
        <text x="36" y="368" fill="#e2e8f0" font-size="10.5">· 而且<tspan fill="#fb7185">别人塞张纸条就能骗走他</tspan></text>
        <text x="36" y="398" fill="#64748b" font-size="9">—— 换个更聪明的人，这五条一条都不会消失</text>

        <rect x="384" y="222" width="376" height="196" rx="8" fill="#0f172a"/>
        <rect x="384" y="222" width="376" height="196" rx="8" fill="rgba(6,78,59,.28)" stroke="#34d399" stroke-width="1.3"/>
        <text x="404" y="246" fill="#34d399" font-size="9.5" font-weight="600">于是你给他配了这些</text>
        <text x="404" y="272" fill="#e2e8f0" font-size="10.5">· 一本<tspan fill="#fff">交接笔记</tspan> —— memory</text>
        <text x="404" y="296" fill="#e2e8f0" font-size="10.5">· 一张<tspan fill="#fff">只摆当前要用的资料的桌子</tspan> —— context</text>
        <text x="404" y="320" fill="#e2e8f0" font-size="10.5">· 一套<tspan fill="#fff">趁手的工具</tspan>与<tspan fill="#fff">用到才翻的手册</tspan> —— tools / SKILL</text>
        <text x="404" y="344" fill="#e2e8f0" font-size="10.5">· 一条<tspan fill="#fff">"做完自己跑一遍测试"的规矩</tspan> —— loop</text>
        <text x="404" y="368" fill="#e2e8f0" font-size="10.5">· 一道<tspan fill="#fff">动手前先问一句的闸门</tspan> —— 权限</text>
        <text x="404" y="398" fill="#64748b" font-size="9">—— 这一整套配置，就叫 harness</text>

        <rect x="776" y="222" width="368" height="196" rx="8" fill="#0f172a"/>
        <rect x="776" y="222" width="368" height="196" rx="8" fill="rgba(120,53,15,.26)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="796" y="246" fill="#fbbf24" font-size="9.5" font-weight="600">所以这一章真正想说的</text>
        <text x="796" y="276" fill="#fff" font-size="13" font-weight="700">招人的事你决定不了 ——</text>
        <text x="796" y="300" fill="#fff" font-size="13" font-weight="700">配桌子、配工具、定规矩，</text>
        <text x="796" y="324" fill="#fbbf24" font-size="13" font-weight="700">这些全是你能决定的。</text>
        <text x="796" y="358" fill="#cbd5e1" font-size="10.5">模型市场上人人都能租到同一个人；</text>
        <text x="796" y="378" fill="#cbd5e1" font-size="10.5">差别出在<tspan fill="#fff" font-weight="700">你把工位搭成什么样</tspan>。</text>
        <text x="796" y="404" fill="#64748b" font-size="9">下一页：这些配置里，真正要你拍板的只有五件事</text>
      </svg>
    </div>
  </div>

  <div class="s-foot">
    <span class="src">本页只做映射，不含新数据 —— 每一格的一手取证在仓库 research/（16 份研究笔记）</span>
    <span class="spacer"></span>
    <span class="pg"></span>
  </div>
</section>
