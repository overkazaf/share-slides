<section class="slide" data-ch="CH3 原理" data-title="一个类比：一句话 → 一台能干活的机器">
  <div class="s-head">
    <div class="s-kicker"><span class="dot emerald"></span>CH 3 · 原理 · 一个类比</div>
    <h1 class="s-title">从<span class="hl">一句 prompt</span>，到<span class="hl-e">一台能干活的机器</span></h1>
    <div class="s-sub">这些名词是从小往大搭的，<b style="color:#e2e8f0">每一层解决的都是上一层解决不了的那个具体问题</b>。先把它们串成一句人话，再落到你要拍板的事。</div>
  </div>

  <div class="s-body">
    <div class="figure plain">
      <svg viewBox="0 0 1160 448" xmlns="http://www.w3.org/2000/svg">
        <!-- 阶梯 -->
        <text x="16" y="20" fill="#64748b" font-size="9">从小到大 · 每一格都是「上一格解决不了的问题」</text>

        <rect x="16" y="30" width="196" height="56" rx="7" fill="rgba(8,51,68,.4)" stroke="#22d3ee" stroke-width="1.3"/>
        <text x="32" y="52" fill="#fff" font-size="11.5" font-weight="700">prompt</text>
        <text x="32" y="70" fill="#94a3b8" font-size="9">你说一句，它答一句</text>

        <rect x="228" y="30" width="196" height="56" rx="7" fill="rgba(76,29,149,.35)" stroke="#a78bfa" stroke-width="1.3"/>
        <text x="244" y="52" fill="#fff" font-size="11.5" font-weight="700">context</text>
        <text x="244" y="70" fill="#94a3b8" font-size="9">一次能带多少东西上路</text>

        <rect x="440" y="30" width="196" height="56" rx="7" fill="rgba(76,29,149,.35)" stroke="#a78bfa" stroke-width="1.3"/>
        <text x="456" y="52" fill="#fff" font-size="11.5" font-weight="700">memory</text>
        <text x="456" y="70" fill="#94a3b8" font-size="9">这次说完，下次还记得</text>

        <rect x="652" y="30" width="196" height="56" rx="7" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="1.3"/>
        <text x="668" y="52" fill="#fff" font-size="11.5" font-weight="700">loop</text>
        <text x="668" y="70" fill="#94a3b8" font-size="9">一步不够，就转起来</text>

        <rect x="864" y="30" width="196" height="56" rx="7" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="1.3"/>
        <text x="880" y="52" fill="#fff" font-size="11.5" font-weight="700">graph</text>
        <text x="880" y="70" fill="#94a3b8" font-size="9">走错能退，多路能并</text>

        <rect x="16" y="100" width="196" height="56" rx="7" fill="rgba(120,53,15,.32)" stroke="#fbbf24" stroke-width="1.3"/>
        <text x="32" y="122" fill="#fff" font-size="11.5" font-weight="700">tools · function calling</text>
        <text x="32" y="140" fill="#94a3b8" font-size="9">光会说不行，得能动手</text>

        <rect x="228" y="100" width="196" height="56" rx="7" fill="rgba(120,53,15,.32)" stroke="#fbbf24" stroke-width="1.3"/>
        <text x="244" y="122" fill="#fff" font-size="11.5" font-weight="700">SKILL</text>
        <text x="244" y="140" fill="#94a3b8" font-size="9">用到才翻的那本手册</text>

        <rect x="440" y="100" width="196" height="56" rx="7" fill="rgba(124,45,18,.32)" stroke="#fb923c" stroke-width="1.3"/>
        <text x="456" y="122" fill="#fff" font-size="11.5" font-weight="700">MCP · Hook · 扩展</text>
        <text x="456" y="140" fill="#94a3b8" font-size="9">接别人的东西、插自己的手</text>

        <rect x="652" y="100" width="196" height="56" rx="7" fill="rgba(136,19,55,.35)" stroke="#fb7185" stroke-width="1.3"/>
        <text x="668" y="122" fill="#fff" font-size="11.5" font-weight="700">workflow / 多 agent</text>
        <text x="668" y="140" fill="#94a3b8" font-size="9">几个凑一起，怎么编排</text>

        <rect x="864" y="100" width="196" height="56" rx="7" fill="rgba(2,6,23,.7)" stroke="#e2e8f0" stroke-width="1.6"/>
        <text x="880" y="122" fill="#fff" font-size="11.5" font-weight="700">harness</text>
        <text x="880" y="140" fill="#cbd5e1" font-size="9">把上面全部装进一台机器</text>

        <!-- 类比 -->
        <path d="M 16 182 L 1144 182" stroke="#1e293b" stroke-width="1"/>
        <text x="16" y="208" fill="#fbbf24" font-size="11" font-weight="700">换个说法：请了个记性很差、但手很快的新同事</text>

        <rect x="16" y="222" width="352" height="196" rx="8" fill="#0f172a"/>
        <rect x="16" y="222" width="352" height="196" rx="8" fill="rgba(8,51,68,.28)" stroke="#22d3ee" stroke-width="1.3"/>
        <text x="36" y="246" fill="#22d3ee" font-size="9.5" font-weight="600">他的问题</text>
        <text x="36" y="272" fill="#e2e8f0" font-size="10.5">· 聪明，但<tspan fill="#fff">一觉醒来什么都不记得</tspan></text>
        <text x="36" y="296" fill="#e2e8f0" font-size="10.5">· 桌上摊太多资料就<tspan fill="#fff">看串行</tspan></text>
        <text x="36" y="320" fill="#e2e8f0" font-size="10.5">· 只会说，<tspan fill="#fff">不给工具就动不了手</tspan></text>
        <text x="36" y="344" fill="#e2e8f0" font-size="10.5">· 干错了<tspan fill="#fff">不知道自己错了</tspan></text>
        <text x="36" y="368" fill="#e2e8f0" font-size="10.5">· 而且<tspan fill="#fb7185">别人塞张纸条就能骗走他</tspan></text>
        <text x="36" y="398" fill="#64748b" font-size="9">—— 换个更聪明的人，这五条一条都不会消失</text>

        <rect x="384" y="222" width="376" height="196" rx="8" fill="#0f172a"/>
        <rect x="384" y="222" width="376" height="196" rx="8" fill="rgba(6,78,59,.28)" stroke="#34d399" stroke-width="1.3"/>
        <text x="404" y="246" fill="#34d399" font-size="9.5" font-weight="600">于是你给他配了这些</text>
        <text x="404" y="272" fill="#e2e8f0" font-size="10.5">· 一本<tspan fill="#fff">交接笔记</tspan> —— memory</text>
        <text x="404" y="296" fill="#e2e8f0" font-size="10.5">· 一张<tspan fill="#fff">只摆当前要用的资料的桌子</tspan> —— context</text>
        <text x="404" y="320" fill="#e2e8f0" font-size="10.5">· 一套<tspan fill="#fff">趁手的工具</tspan>与<tspan fill="#fff">用到才翻的手册</tspan> —— tools / SKILL</text>
        <text x="404" y="344" fill="#e2e8f0" font-size="10.5">· 一条<tspan fill="#fff">"做完自己跑一遍测试"的规矩</tspan> —— loop</text>
        <text x="404" y="368" fill="#e2e8f0" font-size="10.5">· 一道<tspan fill="#fff">动手前先问一句的闸门</tspan> —— 权限</text>
        <text x="404" y="398" fill="#64748b" font-size="9">—— 这一整套配置，就叫 harness</text>

        <rect x="776" y="222" width="368" height="196" rx="8" fill="#0f172a"/>
        <rect x="776" y="222" width="368" height="196" rx="8" fill="rgba(120,53,15,.26)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="796" y="246" fill="#fbbf24" font-size="9.5" font-weight="600">所以这一章真正想说的</text>
        <text x="796" y="276" fill="#fff" font-size="13" font-weight="700">招人的事你决定不了 ——</text>
        <text x="796" y="300" fill="#fff" font-size="13" font-weight="700">配桌子、配工具、定规矩，</text>
        <text x="796" y="324" fill="#fbbf24" font-size="13" font-weight="700">这些全是你能决定的。</text>
        <text x="796" y="358" fill="#cbd5e1" font-size="10.5">模型市场上人人都能租到同一个人；</text>
        <text x="796" y="378" fill="#cbd5e1" font-size="10.5">差别出在<tspan fill="#fff" font-weight="700">你把工位搭成什么样</tspan>。</text>
        <text x="796" y="404" fill="#64748b" font-size="9">下一页：这些配置里，真正要你拍板的只有五件事</text>
      </svg>
    </div>
  </div>
